# Steer would-be issue filers to the right place.
#
# The recurring problem: people open issues asking for an APP or a FEATURE —
# but iappyxOS generates apps on YOUR device from a plain-language description.
# There is no request queue in this repo; you ask the AI inside the app.
#
# blank_issues_enabled: false → the "New issue" button lands on the choices
# below instead of a freeform box, so app/feature requests get intercepted
# before they're filed. (Add a bug-report template later if you want a real
# reporting path; today genuine bugs are pointed at the FAQ.)
blank_issues_enabled: false
contact_links:
  - name: "🧩 Want an app or a feature? Describe it to the AI inside iappyxOS"
    url: https://github.com/iappyx/iappyxOS#quick-start
    about: >-
      iappyxOS builds apps on your own device from a plain-language description —
      there is no request queue here. Open the app, tap Create, and tell the AI
      what you want. App and feature requests filed as issues can't be acted on.
  - name: "❓ Question, or think you found a bug? Check the FAQ first"
    url: https://github.com/iappyx/iappyxOS/blob/main/FAQ.md
    about: >-
      Most questions — offline use, why it's called an "OS", the APK size,
      the three generation modes — are answered in the FAQ.
